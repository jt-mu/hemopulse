ServerName localhost
<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
# Render terminates TLS and supplies this header at its ingress proxy.
# Use this configuration only behind Render's trusted ingress.
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
<Directory /var/www/html/deployment>
    Require all denied
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<Files "Dockerfile">
    Require all denied
</Files>
